<!-- ─── Vignette complète : surgelé + suisse + remise ─── -->
<article class="product-card">
    <a href="https://pitoeuf.ch/produit/SLUG/" class="product-card__link" target="_blank">
        <div class="product-card__media">
            <!-- Badge Surgelé (top-left, flocon bleu) -->
            <span class="product-card__badge product-card__badge--frozen" aria-label="Surgelé" title="Surgelé">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2v20M4.93 4.93l14.14 14.14M2 12h20M4.93 19.07L19.07 4.93M7 4l5 3 5-3M7 20l5-3 5 3M4 7l3 5-3 5M20 7l-3 5 3 5"
                          stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
            </span>

            <!-- Badge origine (top-right, CH / VS) -->
            <span class="product-card__badge product-card__badge--origin">CH</span>

            <img src="../../images/produit-exemple.jpg" alt="Nom du produit" />
        </div>

        <div class="product-card__body">
            <h3 class="product-card__title">Nom du produit</h3>
            <p class="product-card__meta">
                Réf. G1234<br>
                Provenance : Suisse
            </p>
        </div>
    </a>

    <div class="product-card__price-strip">
        <!-- Cercle remise — OMETTRE si pas de promo -->
        <span class="product-card__discount">-20%</span>

        <div class="product-card__prices">
            <span class="product-card__quantity">1 carton | 5 kg</span>
            <span class="product-card__price-current">
                CHF 42.80 <span class="unit">/ kg</span>
            </span>
            <!-- Prix barré — OMETTRE si pas de promo -->
            <span class="product-card__price-regular">CHF 53.50 / kg</span>
        </div>
    </div>
</article>


<!-- ─── Vignette minimale : sans badges, sans promo ─── -->
<article class="product-card">
    <a href="https://pitoeuf.ch/produit/SLUG/" class="product-card__link" target="_blank">
        <div class="product-card__media">
            <img src="../../images/produit-exemple.jpg" alt="Nom du produit" />
        </div>
        <div class="product-card__body">
            <h3 class="product-card__title">Nom du produit</h3>
            <p class="product-card__meta">
                Réf. G5678<br>
                Provenance : France
            </p>
        </div>
    </a>
    <div class="product-card__price-strip">
        <div class="product-card__prices">
            <span class="product-card__quantity">2 x 1 kg</span>
            <span class="product-card__price-current">
                CHF 18.90 <span class="unit">/ kg</span>
            </span>
        </div>
    </div>
</article>
